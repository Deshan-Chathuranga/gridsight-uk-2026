version: '3.8'

services:
  # LocalStack AWS Emulator (Zero-cost AWS S3, DynamoDB, SQS locally)
  localstack:
    container_name: gridsight_localstack
    image: localstack/localstack:latest
    ports:
      - "4566:4566"            # LocalStack Gateway
      - "4510-4559:4510-4559"   # External service port range
    environment:
      - SERVICES=s3,sqs,dynamodb
      - AWS_DEFAULT_REGION=eu-west-2
      - DOCKER_HOST=unix:///var/run/docker.sock
    volumes:
      - "./scripts/init_aws_buckets.sh:/etc/localstack/init/ready.d/init-aws.sh"
      - "${LOCALSTACK_VOLUME_DIR:-./.localstack}:/var/lib/localstack"

  # GridSight UK Web Application Container (FastAPI + React)
  web-app:
    container_name: gridsight_app
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "7860:7860"
    environment:
      - PORT=7860
      - AWS_ENDPOINT_URL=http://localstack:4566
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
      - AWS_REGION=eu-west-2
      - AWS_S3_BUCKET=gridsight-artifacts-bucket
    depends_on:
      - localstack
    restart: unless-stopped

networks:
  default:
    name: gridsight-network
